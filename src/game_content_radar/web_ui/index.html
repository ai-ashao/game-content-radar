<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Game Content Radar</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #0a0d12;
      --panel: #11161f;
      --panel-2: #151c27;
      --border: #263041;
      --text: #edf3ff;
      --muted: #91a0b7;
      --soft: #c8d3e5;
      --accent: #7c9cff;
      --accent-2: #4bd7b5;
      --warn: #f3b44e;
      --danger: #ff6b7a;
      --good: #62d394;
      --shadow: 0 16px 46px rgba(0,0,0,.28);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background:
        radial-gradient(circle at 12% -10%, rgba(124,156,255,.16), transparent 32%),
        radial-gradient(circle at 85% 0%, rgba(75,215,181,.08), transparent 28%),
        var(--bg);
      color: var(--text);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      min-height: 100vh;
    }
    button, select, input, textarea { font: inherit; }
    button { cursor: pointer; }
    a { color: #a8bbff; text-decoration: none; }
    a:hover { text-decoration: underline; }
    .shell { max-width: 1500px; margin: 0 auto; padding: 24px; }
    .topbar {
      display: flex; justify-content: space-between; gap: 20px; align-items: flex-start;
      padding: 8px 0 22px;
    }
    .brand h1 { margin: 0 0 6px; font-size: 26px; letter-spacing: -.02em; }
    .brand p { margin: 0; color: var(--muted); font-size: 14px; }
    .pill {
      display: inline-flex; align-items: center; gap: 7px; border: 1px solid var(--border);
      background: rgba(17,22,31,.8); padding: 7px 10px; border-radius: 999px;
      color: var(--soft); font-size: 12px; white-space: nowrap;
    }
    .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--good); box-shadow: 0 0 0 4px rgba(98,211,148,.08); }
    .controlbar {
      display: grid; grid-template-columns: 1.2fr 1fr 1fr auto auto; gap: 10px;
      background: rgba(17,22,31,.86); border: 1px solid var(--border); border-radius: 16px;
      padding: 14px; box-shadow: var(--shadow); position: sticky; top: 12px; z-index: 8;
      backdrop-filter: blur(14px);
    }
    .field { display: flex; flex-direction: column; gap: 6px; }
    .field label { color: var(--muted); font-size: 11px; text-transform: uppercase; letter-spacing: .08em; }
    select, input[type="date"] {
      width: 100%; color: var(--text); background: #0d121a; border: 1px solid var(--border);
      border-radius: 10px; padding: 10px 11px; outline: none;
    }
    select:focus, input:focus, textarea:focus { border-color: #536ba8; box-shadow: 0 0 0 3px rgba(124,156,255,.1); }
    .primary, .secondary, .ghost {
      border-radius: 10px; padding: 10px 14px; border: 1px solid transparent; font-weight: 700;
      min-height: 40px;
    }
    .primary { color: #081018; background: linear-gradient(135deg, #91a9ff, #66dbc0); }
    .primary:disabled { opacity: .45; cursor: not-allowed; }
    .secondary { background: #1a2230; border-color: #31405a; color: var(--text); }
    .ghost { background: transparent; border-color: var(--border); color: var(--soft); }
    .toolbar-button { align-self: end; }
    .statusline { margin-top: 10px; min-height: 24px; color: var(--muted); font-size: 13px; display: flex; align-items: center; gap: 9px; }
    .spinner { width: 14px; height: 14px; border-radius: 50%; border: 2px solid #3a4558; border-top-color: var(--accent); animation: spin .8s linear infinite; display: none; }
    .spinner.on { display: inline-block; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .mode-banner {
      margin-top: 18px; border-radius: 14px; padding: 12px 14px; border: 1px solid var(--border);
      display: none; font-size: 13px;
    }
    .mode-banner.fixture { display: block; border-color: #795d2c; background: rgba(243,180,78,.09); color: #f9d69a; }
    .mode-banner.offline { display: block; border-color: #5b5366; background: rgba(145,160,183,.08); color: #cad3e0; }
    .mode-banner.live { display: block; border-color: #285c4e; background: rgba(75,215,181,.07); color: #a7ecd9; }
    .stats { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 12px; margin-top: 18px; }
    .stat { background: var(--panel); border: 1px solid var(--border); border-radius: 14px; padding: 16px; }
    .stat .k { color: var(--muted); font-size: 12px; margin-bottom: 8px; }
    .stat .v { font-size: 27px; font-weight: 800; letter-spacing: -.03em; }
    .layout { display: grid; grid-template-columns: minmax(0, 1.65fr) minmax(320px, .75fr); gap: 16px; margin-top: 16px; }
    .stack { display: flex; flex-direction: column; gap: 16px; }
    .panel { background: var(--panel); border: 1px solid var(--border); border-radius: 16px; overflow: hidden; }
    .panel-head { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 15px 16px; border-bottom: 1px solid var(--border); }
    .panel-head h2 { margin: 0; font-size: 15px; }
    .panel-head .sub { color: var(--muted); font-size: 12px; }
    .panel-body { padding: 16px; }
    .picks { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
    .pick-card { border: 1px solid var(--border); background: linear-gradient(145deg, rgba(21,28,39,.96), rgba(14,19,27,.96)); border-radius: 15px; padding: 16px; min-height: 250px; }
    .pick-kicker { color: var(--muted); font-size: 11px; text-transform: uppercase; letter-spacing: .1em; display: flex; justify-content: space-between; align-items: center; gap: 8px; }
    .score { display: inline-flex; align-items: center; justify-content: center; width: 42px; height: 42px; border-radius: 12px; background: #0b1119; border: 1px solid #324057; font-weight: 800; color: #b8c6ff; }
    .pick-card h3 { margin: 13px 0 6px; font-size: 18px; line-height: 1.4; }
    .meta { color: var(--muted); font-size: 12px; display: flex; flex-wrap: wrap; gap: 6px 10px; }
    .reason-list { margin: 14px 0; padding-left: 18px; color: var(--soft); font-size: 13px; line-height: 1.65; }
    .actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 14px; }
    .tiny { padding: 8px 10px; min-height: auto; font-size: 12px; border-radius: 9px; }
    .tag { display: inline-flex; border: 1px solid #334056; background: #121923; color: #aebad0; border-radius: 999px; padding: 3px 8px; font-size: 11px; }
    .table-wrap { overflow: auto; }
    table { width: 100%; border-collapse: collapse; min-width: 760px; }
    th { text-align: left; color: var(--muted); font-size: 11px; font-weight: 600; padding: 11px 12px; border-bottom: 1px solid var(--border); text-transform: uppercase; letter-spacing: .07em; }
    td { padding: 12px; border-bottom: 1px solid #202a39; font-size: 13px; vertical-align: top; }
    tr:last-child td { border-bottom: 0; }
    tbody tr:hover { background: rgba(124,156,255,.035); }
    .rank { color: var(--muted); width: 34px; }
    .score-cell { font-weight: 800; font-variant-numeric: tabular-nums; }
    .site-high { color: #78dfaa; }
    .seo-card h3 { margin: 0 0 8px; line-height: 1.4; }
    .source-cloud { display: flex; flex-wrap: wrap; gap: 8px; }
    .source-item { border: 1px solid var(--border); border-radius: 10px; padding: 7px 9px; font-size: 12px; color: var(--soft); background: var(--panel-2); }
    .warning-list { margin: 0; padding-left: 18px; color: #f1c77f; font-size: 13px; line-height: 1.7; }
    .empty { color: var(--muted); font-size: 13px; padding: 14px 0; }
    .history { display: flex; flex-direction: column; gap: 7px; max-height: 270px; overflow: auto; }
    .history button { text-align: left; background: #0e141d; color: var(--soft); border: 1px solid var(--border); padding: 9px 10px; border-radius: 9px; }
    .history button:hover, .history button.active { border-color: #536ba8; background: #141c29; }
    pre.markdown { white-space: pre-wrap; word-break: break-word; background: #0c1118; border: 1px solid var(--border); border-radius: 12px; padding: 13px; max-height: 420px; overflow: auto; color: #cfd8e7; font-size: 12px; line-height: 1.65; }
    .drawer-backdrop { position: fixed; inset: 0; background: rgba(0,0,0,.62); z-index: 30; display: none; }
    .drawer-backdrop.on { display: block; }
    .drawer { position: fixed; top: 0; right: 0; height: 100vh; width: min(720px, 94vw); background: #0d121a; border-left: 1px solid var(--border); z-index: 31; transform: translateX(100%); transition: transform .2s ease; display: flex; flex-direction: column; box-shadow: -18px 0 70px rgba(0,0,0,.4); }
    .drawer.on { transform: translateX(0); }
    .drawer-head { padding: 16px 18px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; gap: 12px; align-items: center; }
    .drawer-head h2 { font-size: 16px; margin: 0; }
    .drawer-body { padding: 16px 18px 40px; overflow: auto; flex: 1; }
    .drawer label { display: block; color: var(--muted); font-size: 11px; text-transform: uppercase; letter-spacing: .08em; margin: 16px 0 7px; }
    .drawer input[type="text"], .drawer textarea { width: 100%; background: #0a0f16; color: var(--text); border: 1px solid var(--border); border-radius: 10px; padding: 11px 12px; outline: none; }
    .drawer textarea { min-height: 320px; resize: vertical; line-height: 1.65; }
    .title-options { display: flex; flex-direction: column; gap: 7px; }
    .title-option { width: 100%; text-align: left; background: #111821; border: 1px solid var(--border); color: var(--soft); border-radius: 10px; padding: 9px 10px; font-size: 12px; line-height: 1.5; }
    .title-option:hover { border-color: #536ba8; }
    .evidence { font-size: 12px; color: var(--muted); line-height: 1.6; }
    .toast { position: fixed; bottom: 18px; left: 50%; transform: translateX(-50%) translateY(20px); background: #182232; border: 1px solid #3a4b66; color: var(--text); padding: 10px 14px; border-radius: 10px; opacity: 0; pointer-events: none; transition: .18s ease; z-index: 50; box-shadow: var(--shadow); }
    .toast.on { opacity: 1; transform: translateX(-50%) translateY(0); }
    @media (max-width: 1000px) {
      .controlbar { grid-template-columns: 1fr 1fr; position: static; }
      .toolbar-button { align-self: auto; }
      .stats { grid-template-columns: repeat(3, 1fr); }
      .layout { grid-template-columns: 1fr; }
    }
    @media (max-width: 700px) {
      .shell { padding: 15px; }
      .topbar { flex-direction: column; }
      .controlbar { grid-template-columns: 1fr; }
      .stats { grid-template-columns: 1fr 1fr; }
      .picks { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <div class="shell">
    <div class="topbar">
      <div class="brand">
        <h1>Game Content Radar</h1>
        <p>游戏情报 → 小黑盒选题 → Draft → SEO / 建站机会</p>
      </div>
      <div class="pill"><span class="dot"></span><span id="serverState">本地服务已连接</span></div>
    </div>

    <div class="controlbar">
      <div class="field">
        <label>配置</label>
        <select id="configSelect"></select>
      </div>
      <div class="field">
        <label>运行模式</label>
        <select id="modeSelect">
          <option value="live">Live · 真实网络</option>
          <option value="fixture">Fixture · 测试数据</option>
          <option value="offline">Offline · 不联网</option>
        </select>
      </div>
      <div class="field">
        <label>日期（可选）</label>
        <input id="dateInput" type="date" />
      </div>
      <button class="primary toolbar-button" id="runButton">运行今日雷达</button>
      <button class="secondary toolbar-button" id="refreshButton">刷新结果</button>
    </div>
    <div class="statusline"><span class="spinner" id="spinner"></span><span id="statusText">正在读取报告…</span></div>
    <div id="modeBanner" class="mode-banner"></div>

    <div class="stats" id="stats"></div>

    <div class="layout">
      <main class="stack">
        <section class="panel">
          <div class="panel-head">
            <div><h2>今日推荐</h2><div class="sub">Reach 负责覆盖，Value 负责深度</div></div>
            <span class="tag" id="reportDate">尚无报告</span>
          </div>
          <div class="panel-body"><div class="picks" id="picks"></div></div>
        </section>

        <section class="panel">
          <div class="panel-head"><div><h2>Top Candidates</h2><div class="sub">XHH 发布分与 Site 预评分独立展示</div></div></div>
          <div class="table-wrap" id="candidateTable"></div>
        </section>

        <section class="panel">
          <div class="panel-head"><div><h2>SEO Opportunities</h2><div class="sub">仅为 PRE-SERP 候选，仍需 Semrush / SERP 验证</div></div></div>
          <div class="panel-body"><pre class="markdown" id="seoMarkdown">暂无数据</pre></div>
        </section>
      </main>

      <aside class="stack">
        <section class="panel">
          <div class="panel-head"><div><h2>最佳 SEO / 建站候选</h2><div class="sub">不是小黑盒热度排行</div></div></div>
          <div class="panel-body" id="seoPick"></div>
        </section>

        <section class="panel">
          <div class="panel-head"><div><h2>数据源</h2><div class="sub">本次报告实际收到的条目</div></div></div>
          <div class="panel-body"><div class="source-cloud" id="sourceCounts"></div></div>
        </section>

        <section class="panel">
          <div class="panel-head"><div><h2>Warnings</h2><div class="sub">失败数据源与运行模式都会显示</div></div></div>
          <div class="panel-body" id="warnings"></div>
        </section>

        <section class="panel">
          <div class="panel-head"><div><h2>历史报告</h2><div class="sub">点击切换日期</div></div></div>
          <div class="panel-body"><div class="history" id="history"></div></div>
        </section>
      </aside>
    </div>
  </div>

  <div class="drawer-backdrop" id="drawerBackdrop"></div>
  <aside class="drawer" id="drawer">
    <div class="drawer-head">
      <h2 id="drawerTitle">小黑盒 Draft</h2>
      <button class="ghost tiny" id="closeDrawer">关闭</button>
    </div>
    <div class="drawer-body">
      <div class="actions">
        <button class="primary tiny" id="copyDraft">复制发布文本</button>
        <button class="secondary tiny" id="saveDraft">保存编辑稿</button>
      </div>
      <label>标题</label>
      <input id="draftTitle" type="text" />
      <label>标题候选</label>
      <div class="title-options" id="titleOptions"></div>
      <label>正文</label>
      <textarea id="draftBody"></textarea>
      <label>互动问题</label>
      <input id="commentHook" type="text" />
      <label>Evidence / Sources</label>
      <div class="evidence" id="draftEvidence"></div>
    </div>
  </aside>
  <div class="toast" id="toast"></div>

<script>
  const state = { meta: null, report: null, activeDate: null, activeDraftSlug: null, jobId: null };
  const $ = (id) => document.getElementById(id);

  function esc(value) {
    return String(value ?? "").replace(/[&<>'"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
  }

  function jsArg(value) {
    return encodeURIComponent(String(value ?? '')).replace(/'/g, '%27');
  }

  function safeUrl(value) {
    try {
      const url = new URL(String(value ?? ''));
      return ['http:', 'https:'].includes(url.protocol) ? url.href : '';
    } catch {
      return '';
    }
  }

  function toast(message) {
    const el = $('toast');
    el.textContent = message;
    el.classList.add('on');
    clearTimeout(el._timer);
    el._timer = setTimeout(() => el.classList.remove('on'), 1800);
  }

  async function api(path, options = {}) {
    const res = await fetch(path, { headers: {'Content-Type': 'application/json'}, ...options });
    let data = null;
    try { data = await res.json(); } catch { data = {}; }
    if (!res.ok) throw new Error(data.detail || `HTTP ${res.status}`);
    return data;
  }

  function configQuery() {
    const value = $('configSelect').value;
    return value ? `?config=${encodeURIComponent(value)}` : '';
  }

  async function loadMeta() {
    state.meta = await api('/api/meta');
    const select = $('configSelect');
    select.innerHTML = '';
    const configs = state.meta.configs.length ? state.meta.configs : [state.meta.default_config];
    configs.forEach(path => {
      const option = document.createElement('option');
      option.value = path;
      option.textContent = path;
      if (path === state.meta.default_config) option.selected = true;
      select.appendChild(option);
    });
  }

  async function loadReports(preferredDate = null) {
    const data = await api('/api/reports' + configQuery());
    renderHistory(data.dates || []);
    const date = preferredDate || state.activeDate || data.dates?.[0];
    if (date) await loadReport(date);
    else renderEmptyDashboard();
  }

  async function loadReport(date) {
    setStatus(`正在读取 ${date}…`, true);
    const report = await api(`/api/reports/${encodeURIComponent(date)}` + configQuery());
    state.report = report;
    state.activeDate = date;
    renderReport(report);
    const dates = [...document.querySelectorAll('#history button')];
    dates.forEach(b => b.classList.toggle('active', b.dataset.date === date));
    setStatus(`已加载 ${date} 报告`, false);
  }

  function renderEmptyDashboard() {
    state.report = null;
    state.activeDate = null;
    $('reportDate').textContent = '尚无报告';
    $('stats').innerHTML = [
      ['Raw Items', 0], ['Events', 0], ['A-tier', 0], ['B-tier', 0], ['Warnings', 0]
    ].map(([k,v]) => `<div class="stat"><div class="k">${k}</div><div class="v">${v}</div></div>`).join('');
    $('picks').innerHTML = '<div class="empty">还没有报告。选择 Live 或 Fixture 后点击“运行今日雷达”。</div>';
    $('candidateTable').innerHTML = '<div class="empty" style="padding:16px">暂无候选。</div>';
    $('seoPick').innerHTML = '<div class="empty">暂无候选。</div>';
    $('sourceCounts').innerHTML = '<span class="empty">暂无数据</span>';
    $('warnings').innerHTML = '<div class="empty">暂无 Warning</div>';
    $('seoMarkdown').textContent = '暂无数据';
    $('modeBanner').className = 'mode-banner';
  }

  function renderReport(report) {
    $('reportDate').textContent = report.date;
    renderModeBanner(report.mode, report.warnings || []);
    const stats = report.stats || {};
    const rows = [
      ['Raw Items', stats.raw_items ?? 0],
      ['Events', stats.events ?? 0],
      ['A-tier (80+)', stats.a_tier ?? 0],
      ['B-tier (65–79)', stats.b_tier ?? 0],
      ['Warnings', (report.warnings || []).length],
    ];
    $('stats').innerHTML = rows.map(([k,v]) => `<div class="stat"><div class="k">${esc(k)}</div><div class="v">${esc(v)}</div></div>`).join('');
    renderPicks(report);
    renderCandidates(report.candidates || []);
    renderSeoPick(report.seo_pick);
    renderSources(report.source_counts || {});
    renderWarnings(report.warnings || []);
    $('seoMarkdown').textContent = report.seo_markdown || '暂无 SEO Opportunity 文件。';
  }

  function renderModeBanner(mode, warnings) {
    const el = $('modeBanner');
    el.className = `mode-banner ${mode}`;
    if (mode === 'fixture') {
      el.innerHTML = '<strong>Fixture 测试报告</strong>：当前数据来自 synthetic/offline fixture，不代表真实 Steam / Epic / Reddit / 小黑盒当天信息。请切到 <strong>Live</strong> 再做选题决策。';
    } else if (mode === 'offline') {
      el.innerHTML = '<strong>Offline 报告</strong>：本次没有执行网络采集，只用于检查流程。';
    } else {
      const failureCount = warnings.filter(x => /failed|unavailable|error/i.test(x)).length;
      el.innerHTML = failureCount
        ? `<strong>Live 报告</strong>：已执行真实网络采集，但有 ${failureCount} 个数据源/步骤出现异常，请先看 Warnings。`
        : '<strong>Live 报告</strong>：数据来自本次真实网络采集，可进入人工审核流程。';
    }
  }

  function pickHtml(kind, event, draftSlug, draft) {
    if (!event) return `<div class="pick-card"><div class="pick-kicker">${kind}</div><div class="empty">今天没有达到阈值的推荐。</div></div>`;
    const reasons = (event.xhh_reasons || []).slice(0, 4).map(r => `<li>${esc(r)}</li>`).join('');
    const draftButton = draft ? `<button class="primary tiny" onclick="openDraft('${draftSlug}')">打开 Draft</button>` : '';
    const sources = (event.source_names || []).map(s => `<span class="tag">${esc(s)}</span>`).join(' ');
    return `<div class="pick-card">
      <div class="pick-kicker"><span>${esc(kind)}</span><span class="score">${esc(event.xhh_score)}</span></div>
      <h3>${esc(event.event_title)}</h3>
      <div class="meta"><span>${esc(event.game_name)}</span><span>${esc(event.category)}</span><span>Site ${esc(event.site_score)}</span></div>
      <div style="margin-top:10px">${sources}</div>
      <ul class="reason-list">${reasons || '<li>暂无评分理由</li>'}</ul>
      <div class="actions">${draftButton}<button class="ghost tiny" onclick="copyText('${jsArg(event.event_title)}')">复制选题</button></div>
    </div>`;
  }

  function renderPicks(report) {
    $('picks').innerHTML =
      pickHtml('Reach Pick', report.reach_pick, 'reach-pick', report.drafts?.['reach-pick']) +
      pickHtml('Value Pick', report.value_pick, 'value-pick', report.drafts?.['value-pick']);
  }

  function renderCandidates(items) {
    if (!items.length) {
      $('candidateTable').innerHTML = '<div class="empty" style="padding:16px">暂无候选。</div>';
      return;
    }
    const body = items.map((e, i) => `<tr>
      <td class="rank">${i + 1}</td>
      <td><strong>${esc(e.event_title)}</strong><div class="meta" style="margin-top:5px">${esc(e.game_name)}</div></td>
      <td><span class="tag">${esc(e.category)}</span></td>
      <td class="score-cell">${esc(e.xhh_score)}</td>
      <td class="score-cell ${e.site_score >= 70 ? 'site-high' : ''}">${esc(e.site_score)}</td>
      <td>${(e.source_names || []).map(esc).join(', ') || '-'}</td>
    </tr>`).join('');
    $('candidateTable').innerHTML = `<table><thead><tr><th>#</th><th>Event</th><th>Type</th><th>XHH</th><th>Site(pre)</th><th>Sources</th></tr></thead><tbody>${body}</tbody></table>`;
  }

  function renderSeoPick(event) {
    if (!event) { $('seoPick').innerHTML = '<div class="empty">暂无候选。</div>'; return; }
    const sourceLinks = (event.source_urls || []).slice(0,4)
      .map((url, i) => [safeUrl(url), i])
      .filter(([url]) => url)
      .map(([url, i]) => `<a href="${esc(url)}" target="_blank" rel="noreferrer">来源 ${i + 1}</a>`)
      .join(' · ');
    $('seoPick').innerHTML = `<div class="seo-card">
      <div class="score" style="float:right">${esc(event.site_score)}</div>
      <h3>${esc(event.event_title)}</h3>
      <div class="meta"><span>${esc(event.category)}</span><span>XHH ${esc(event.xhh_score)}</span></div>
      <p style="color:var(--soft);font-size:13px;line-height:1.65;margin:14px 0">这是 PRE-SERP 分数，只表示值得进一步验证，不等于“应该马上建站”。</p>
      <div class="meta">${sourceLinks || '暂无来源链接'}</div>
    </div>`;
  }

  function renderSources(counts) {
    const entries = Object.entries(counts);
    $('sourceCounts').innerHTML = entries.length
      ? entries.map(([name,count]) => `<span class="source-item">${esc(name)} · <strong>${esc(count)}</strong></span>`).join('')
      : '<span class="empty">暂无数据</span>';
  }

  function renderWarnings(items) {
    $('warnings').innerHTML = items.length
      ? `<ul class="warning-list">${items.map(x => `<li>${esc(x)}</li>`).join('')}</ul>`
      : '<div class="empty">没有 Warning。</div>';
  }

  function renderHistory(dates) {
    $('history').innerHTML = dates.length
      ? dates.map(date => `<button data-date="${esc(date)}" onclick="loadReport('${esc(date)}')">${esc(date)}</button>`).join('')
      : '<div class="empty">暂无历史报告。</div>';
  }

  function setStatus(text, spinning) {
    $('statusText').textContent = text;
    $('spinner').classList.toggle('on', !!spinning);
  }

  async function startRun() {
    const mode = $('modeSelect').value;
    const config = $('configSelect').value;
    const date = $('dateInput').value || null;
    $('runButton').disabled = true;
    setStatus(mode === 'live' ? '真实网络采集中，可能需要几分钟…' : '正在运行测试流程…', true);
    try {
      const job = await api('/api/run', {
        method: 'POST',
        body: JSON.stringify({ mode, config, date })
      });
      state.jobId = job.id;
      pollJob(job.id);
    } catch (err) {
      $('runButton').disabled = false;
      setStatus(`运行失败：${err.message}`, false);
    }
  }

  async function pollJob(jobId) {
    try {
      const job = await api(`/api/jobs/${jobId}`);
      if (job.status === 'done') {
        $('runButton').disabled = false;
        state.report = job.report;
        state.activeDate = job.date;
        renderReport(job.report);
        await loadReports(job.date);
        setStatus(`完成：${job.date}`, false);
        toast('今日雷达已生成');
        return;
      }
      if (job.status === 'error') {
        $('runButton').disabled = false;
        setStatus(`运行失败：${job.error}`, false);
        return;
      }
      setStatus(job.status === 'queued' ? '任务已排队…' : '采集 / 聚类 / 评分 / 生成 Draft 中…', true);
      setTimeout(() => pollJob(jobId), 1300);
    } catch (err) {
      $('runButton').disabled = false;
      setStatus(`任务状态读取失败：${err.message}`, false);
    }
  }

  function openDraft(slug) {
    const draft = state.report?.drafts?.[slug];
    if (!draft) return toast('这个选题没有 Draft');
    state.activeDraftSlug = slug;
    $('drawerTitle').textContent = slug === 'reach-pick' ? 'Reach Pick Draft' : slug === 'value-pick' ? 'Value Pick Draft' : 'Alternative Draft';
    $('draftTitle').value = draft.selected_title || '';
    $('draftBody').value = draft.body_markdown || '';
    $('commentHook').value = draft.comment_hook || '';
    $('titleOptions').innerHTML = (draft.title_candidates || []).map(t => `<button class="title-option" onclick="chooseTitle('${jsArg(t.title || '')}')"><strong>${esc(t.style || '候选')}</strong> · ${esc(t.title || '')}${t.score ? ` <span style="color:var(--muted)">(${esc(t.score)})</span>` : ''}</button>`).join('') || '<div class="empty">没有其他标题候选</div>';
    const evidence = (draft.evidence || []).map((e, i) => {
      const source = safeUrl(e.source);
      const link = source ? `<br><a href="${esc(source)}" target="_blank" rel="noreferrer">${esc(source)}</a>` : '';
      return `<div style="margin-bottom:9px"><strong>#${i+1}</strong> ${esc(e.claim || e.type || JSON.stringify(e))}${link}</div>`;
    }).join('');
    $('draftEvidence').innerHTML = evidence || '暂无 Evidence';
    $('drawerBackdrop').classList.add('on');
    $('drawer').classList.add('on');
  }

  function closeDraft() {
    $('drawerBackdrop').classList.remove('on');
    $('drawer').classList.remove('on');
  }

  function chooseTitle(encoded) {
    $('draftTitle').value = decodeURIComponent(encoded);
  }

  async function copyDraft() {
    const text = `${$('draftTitle').value}\n\n${$('draftBody').value}\n\n${$('commentHook').value}`.trim();
    await navigator.clipboard.writeText(text);
    toast('发布文本已复制');
  }

  async function saveDraft() {
    if (!state.activeDate || !state.activeDraftSlug) return;
    try {
      const result = await api(`/api/drafts/${state.activeDate}/${state.activeDraftSlug}` + configQuery(), {
        method: 'PUT',
        body: JSON.stringify({
          title: $('draftTitle').value,
          body_markdown: $('draftBody').value,
          comment_hook: $('commentHook').value,
        })
      });
      toast(`已保存：${result.path}`);
    } catch (err) {
      toast(`保存失败：${err.message}`);
    }
  }

  async function copyText(encoded) {
    await navigator.clipboard.writeText(decodeURIComponent(encoded));
    toast('已复制');
  }

  $('runButton').addEventListener('click', startRun);
  $('refreshButton').addEventListener('click', () => loadReports(state.activeDate).catch(err => setStatus(err.message, false)));
  $('configSelect').addEventListener('change', () => { state.activeDate = null; loadReports().catch(err => setStatus(err.message, false)); });
  $('closeDrawer').addEventListener('click', closeDraft);
  $('drawerBackdrop').addEventListener('click', closeDraft);
  $('copyDraft').addEventListener('click', copyDraft);
  $('saveDraft').addEventListener('click', saveDraft);

  (async function boot() {
    try {
      await loadMeta();
      await loadReports();
      if (!state.report) setStatus('没有现成报告，可以先用 Fixture 验证 UI，再切 Live。', false);
    } catch (err) {
      $('serverState').textContent = '服务异常';
      setStatus(`初始化失败：${err.message}`, false);
      renderEmptyDashboard();
    }
  })();
</script>
</body>
</html>
