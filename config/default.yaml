# game-content-radar V1.2

sources:
  steam_store: true
  steam_news: true
  steam_players: true
  reddit: true
  epic: true
  # Optional best-effort public web sources. Keep disabled by default because layouts/anti-bot can change.
  xiaoheihe: false
  steamdb: false
  official_rss: false

collection:
  country: CN
  request_timeout_seconds: 15
  sale_roundup_min_items: 20
  sale_roundup_min_discount: 30
  player_scan_limit: 30
  subreddits:
    - gaming
    - Steam
  # Steam news/player monitoring is much stronger when you add games you actually care about.
  watched_apps:
    730: Counter-Strike 2
  official_rss: []

content:
  language: zh-CN
  daily_candidates: 10
  daily_drafts: 3
  recommended_posts: 2

paths:
  reports: reports
  data: data

# Used only for opportunity matching. Edit these terms to match your current sites.
existing_sites:
  WorkshopFetch:
    - steam workshop
    - workshop download
    - steamcmd
    - workshop error
  GameKitHQ:
    - game tool
    - calculator
    - tracker
    - generator
  FN Sprite Hub:
    - fortnite sprite
    - sprite tracker

# heuristic = deterministic evidence-first drafts, works with no AI API.
# command = pipe a JSON evidence envelope to your own local/CLI LLM command; it must return JSON.
llm:
  mode: heuristic
  command: ""
